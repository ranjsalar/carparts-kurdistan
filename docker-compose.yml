services:
  db:
    image: postgres:16-alpine
    container_name: carparts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carparts
      POSTGRES_PASSWORD: carparts
      POSTGRES_DB: carparts
    ports:
      - "5433:5432"
    volumes:
      - carparts_pgdata:/var/lib/postgresql/data

volumes:
  carparts_pgdata:
